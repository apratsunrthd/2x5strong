<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2x5 Strong</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ── App shell ─────────────────────────────────────── */
    .main {
      max-width: 680px;
      margin: 0 auto;
      padding: 24px 20px 80px;
    }

    /* ── Loading ──────────────────────────────────────── */
    #app-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 52px);
      gap: 16px;
      color: var(--muted);
    }
    .loading-brand {
      font-family: var(--font-d);
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 1px;
      color: var(--accent);
    }
    .loading-brand span { color: var(--muted); font-weight: 400; }

    /* ── Nav user pill ────────────────────────────────── */
    .user-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 3px 12px 3px 3px;
      font-size: 13px;
      color: var(--muted);
    }

    /* ── Workout tab ──────────────────────────────────── */
    .workout-header { margin-bottom: 24px; }
    .workout-day-label {
      font-family: var(--font-d);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .workout-day-label::before {
      content: '';
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
    }
    .workout-title {
      font-family: var(--font-d);
      font-size: 44px;
      font-weight: 900;
      letter-spacing: 1px;
      line-height: 1;
    }
    .workout-subtitle {
      color: var(--muted);
      font-size: 13px;
      margin-top: 6px;
    }

    /* ── Lift cards ───────────────────────────────────── */
    .lifts { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }

    .lift-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      transition: border-color 0.2s;
    }
    .lift-card.lift-done { border-color: var(--success); }
    .lift-card.lift-fail { border-color: var(--danger); }

    .lift-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 12px;
    }
    .lift-name {
      font-family: var(--font-d);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
      line-height: 1.2;
    }
    .lift-warn {
      font-size: 12px;
      color: var(--danger);
      margin-top: 4px;
      font-style: italic;
    }
    .deload-note { color: var(--info); }

    .lift-weight-block { text-align: right; flex-shrink: 0; }
    .lift-weight {
      font-family: var(--font-d);
      font-size: 38px;
      font-weight: 900;
      color: var(--accent);
      line-height: 1;
    }
    .lift-weight span {
      font-size: 18px;
      font-weight: 500;
      color: var(--accent-dim);
      margin-left: 2px;
    }
    .lift-prescription {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .sets-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .set-btn {
      width: 42px; height: 42px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: var(--surface2);
      color: var(--muted);
      font-family: var(--font-d);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.12s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .set-btn:hover:not(.done):not(.fail) { border-color: var(--accent); color: var(--accent); }
    .set-btn.done { background: var(--success); border-color: var(--success); color: #000; }
    .set-btn.fail { background: var(--danger); border-color: var(--danger); color: #fff; }
    .set-btn.partial { background: var(--accent-bg); border-color: var(--accent-dim); color: var(--accent); }
    .set-btn.locked { background: transparent; border-color: var(--border); color: var(--muted2); cursor: not-allowed; opacity: 0.4; }
    .lift-card.lift-locked { border-color: var(--muted2); opacity: 0.75; }
    .sets-count {
      font-size: 12px;
      color: var(--muted);
      margin-left: 4px;
    }

    /* ── Finish button ────────────────────────────────── */
    .finish-btn {
      width: 100%;
      padding: 17px;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: var(--radius);
      font-family: var(--font-d);
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 1px;
      cursor: pointer;
      transition: opacity 0.12s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .finish-btn:hover:not(:disabled) { opacity: 0.9; }
    .finish-btn:disabled { opacity: 0.4; cursor: default; }

    /* ── History tab ──────────────────────────────────── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    @media (max-width: 480px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px;
    }
    .stat-label {
      font-family: var(--font-d);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .stat-val {
      font-family: var(--font-d);
      font-size: 28px;
      font-weight: 900;
    }

    .history-list { display: flex; flex-direction: column; gap: 10px; }
    .history-item { }
    .history-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .history-day {
      font-family: var(--font-d);
      font-size: 16px;
      font-weight: 700;
    }
    .history-date {
      font-size: 12px;
      color: var(--muted);
    }
    .history-lifts {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .h-lift {
      font-size: 12px;
      background: var(--surface2);
      border-radius: 6px;
      padding: 3px 9px;
      color: var(--muted);
    }
    .h-lift.pass { color: var(--success); }
    .h-lift.fail { color: var(--danger); }

    /* ── Settings tab ─────────────────────────────────── */
    .settings-section { margin-bottom: 28px; }
    .settings-section-title {
      font-family: var(--font-d);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted2);
      margin-bottom: 4px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .settings-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .settings-row:last-child { border-bottom: none; }
    .settings-label {
      font-size: 14px;
      font-weight: 500;
    }

    /* ── Section title ────────────────────────────────── */
    .section-title {
      font-family: var(--font-d);
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }

    /* ── Empty state ──────────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--muted);
    }
    .empty-icon { font-size: 48px; margin-bottom: 16px; }
    .empty-state h3 {
      font-family: var(--font-d);
      font-size: 22px;
      color: var(--text);
      margin-bottom: 8px;
    }
    .empty-state p {
      font-size: 14px;
      line-height: 1.6;
      max-width: 280px;
      margin: 0 auto;
    }

    .loading-msg {
      text-align: center;
      padding: 32px;
      color: var(--muted);
      font-size: 14px;
    }
  </style>
</head>
<body>

<!-- Nav -->
<nav class="nav">
  <div class="nav-brand">2X5 <span>STRONG</span></div>
  <div class="user-pill">
    <div class="avatar avatar-sm" id="nav-avatar"></div>
    <span id="nav-name" style="font-size:13px;color:var(--muted);"></span>
  </div>
</nav>

<!-- Loading state -->
<div id="app-loading">
  <div class="loading-brand">2X5 <span>STRONG</span></div>
  <span class="spinner" style="color:var(--accent);width:24px;height:24px;border-width:2.5px;"></span>
</div>

<!-- App content (hidden until loaded) -->
<div id="app-content" style="display:none;">
  <div class="main">

    <!-- Workout Tab -->
    <div class="tab-pane" id="tab-workout">
      <div class="workout-header">
        <div class="workout-day-label" id="workout-day">WORKOUT A</div>
        <div class="workout-title">TODAY'S SESSION</div>
        <div class="workout-subtitle" id="workout-subtitle"></div>
      </div>
      <div class="lifts" id="lifts-container"></div>
      <button class="finish-btn" id="finish-btn" onclick="openFinishModal()" disabled>
        FINISH WORKOUT
      </button>
    </div>

    <!-- History Tab -->
    <div class="tab-pane" id="tab-history" style="display:none;">
      <div class="section-title">HISTORY</div>
      <div id="history-container"></div>
    </div>

    <!-- Settings Tab -->
    <div class="tab-pane" id="tab-settings" style="display:none;">
      <div class="section-title">SETTINGS</div>
      <div id="settings-container"></div>
    </div>

  </div>
</div>

<!-- Bottom nav -->
<div class="bottom-nav" id="bottom-nav">
  <div class="bottom-nav-inner">
    <button class="bnav-btn active" id="bnav-workout" onclick="showTab('workout')">
      <svg viewBox="0 0 24 24"><path d="M6.5 6.5h11M6.5 17.5h11M4 12h16M7 9l-1-2.5M17 9l1-2.5M7 15l-1 2.5M17 15l1 2.5"/></svg>
      WORKOUT
    </button>
    <button class="bnav-btn" id="bnav-history" onclick="showTab('history')">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      HISTORY
    </button>
    <button class="bnav-btn" id="bnav-settings" onclick="showTab('settings')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      SETTINGS
    </button>
  </div>
</div>

<!-- Finish Workout Modal -->
<div class="modal-overlay" id="finish-modal">
  <div class="modal-box">
    <h2 id="modal-title">SAVE SESSION?</h2>
    <p id="modal-body"></p>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeFinishModal()">CANCEL</button>
      <button class="btn btn-primary" onclick="confirmFinish()">SAVE</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<script type="module" src="js/app.js"></script>

</body>
</html>
