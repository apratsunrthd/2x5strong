<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Never Behind</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ── App shell ─────────────────────────────────────── */
    .main {
      max-width: 680px;
      margin: 0 auto;
      padding: 24px 20px 80px;
    }

    /* ── Loading ──────────────────────────────────────── */
    #app-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 52px);
      gap: 16px;
      color: var(--muted);
    }
    .loading-brand {
      font-family: var(--font-d);
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 1px;
      color: var(--accent);
    }
    .loading-brand span { color: var(--muted); font-weight: 400; }

    /* ── Nav user pill ────────────────────────────────── */
    .user-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 3px 12px 3px 3px;
      font-size: 13px;
      color: var(--muted);
    }

    /* ── Workout tab ──────────────────────────────────── */
    .workout-header { margin-bottom: 24px; }
    .workout-day-label {
      font-family: var(--font-d);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .day-switch-btn {
      background: none;
      border: none;
      color: var(--muted2);
      cursor: pointer;
      padding: 2px;
      display: flex;
      align-items: center;
      transition: color 0.12s, transform 0.15s;
    }
    .day-switch-btn:hover { color: var(--accent); transform: rotate(90deg); }
    .day-switch-btn svg { width: 14px; height: 14px; }

    .workout-day-label::before {
      content: '';
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
    }
    .workout-title {
      font-family: var(--font-d);
      font-size: 44px;
      font-weight: 900;
      letter-spacing: 1px;
      line-height: 1;
    }
    .workout-subtitle {
      color: var(--muted);
      font-size: 13px;
      margin-top: 6px;
    }

    /* ── Lift cards ───────────────────────────────────── */
    .lifts { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }

    .lift-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      transition: border-color 0.2s;
    }
    .lift-card.lift-done { border-color: var(--success); }
    .lift-card.lift-fail { border-color: var(--danger); }

    .lift-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 12px;
    }
    .lift-name {
      font-family: var(--font-d);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
      line-height: 1.2;
    }
    .lift-warn {
      font-size: 12px;
      color: var(--danger);
      margin-top: 4px;
      font-style: italic;
    }
    .deload-note { color: var(--info); }

    .lift-weight-block { text-align: right; flex-shrink: 0; }
    .lift-weight {
      font-family: var(--font-d);
      font-size: 38px;
      font-weight: 900;
      color: var(--accent);
      line-height: 1;
    }
    .lift-weight span {
      font-size: 18px;
      font-weight: 500;
      color: var(--accent-dim);
      margin-left: 2px;
    }
    .lift-prescription {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .sets-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .set-btn {
      width: 42px; height: 42px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: var(--surface2);
      color: var(--muted);
      font-family: var(--font-d);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.12s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .set-btn:hover:not(.done):not(.fail) { border-color: var(--accent); color: var(--accent); }
    .set-btn.done { background: var(--success); border-color: var(--success); color: #000; }
    .set-btn.fail { background: var(--danger); border-color: var(--danger); color: #fff; }
    .set-btn.partial { background: var(--accent-bg); border-color: var(--accent-dim); color: var(--accent); }
    .set-btn.locked { background: transparent; border-color: var(--border); color: var(--muted2); cursor: not-allowed; opacity: 0.4; }
    .set-btn.optional { border-style: dashed; opacity: 0.5; }
    .set-btn.optional:hover { opacity: 0.85; }
    .lift-card.lift-locked { border-color: var(--muted2); opacity: 0.75; }


    /* ── Accessories ─────────────────────────────────── */
    .accessories-section {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    .accessories-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .accessories-title {
      font-family: var(--font-d);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .accessories-title span {
      font-size: 13px;
      font-weight: 400;
      color: var(--muted);
      margin-left: 8px;
      font-family: var(--font-b);
      letter-spacing: 0;
    }
    .add-accessory-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 7px 14px;
      color: var(--text);
      font-family: var(--font-d);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.12s;
    }
    .add-accessory-btn:hover { border-color: var(--accent); color: var(--accent); }

    .accessory-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }

    .accessory-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
    }
    .accessory-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .accessory-name {
      font-family: var(--font-d);
      font-size: 18px;
      font-weight: 700;
    }
    .accessory-type-badge {
      font-family: var(--font-d);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 4px;
    }
    .type-standard { background: var(--surface2); color: var(--muted); }
    .type-assisted { background: var(--info-bg); color: var(--info); }
    .type-weighted { background: var(--accent-bg); color: var(--accent-dim); }

    .accessory-remove {
      background: none;
      border: none;
      color: var(--muted2);
      cursor: pointer;
      padding: 4px;
      font-size: 16px;
      line-height: 1;
      transition: color 0.12s;
    }
    .accessory-remove:hover { color: var(--danger); }

    .accessory-sets { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
    .accessory-set-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }
    .accessory-set-num {
      font-family: var(--font-d);
      font-weight: 700;
      color: var(--muted2);
      min-width: 24px;
    }
    .accessory-input {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 8px;
      color: var(--text);
      font-size: 13px;
      font-family: var(--font-b);
      width: 64px;
      outline: none;
      text-align: center;
    }
    .accessory-input:focus { border-color: var(--accent); }
    .accessory-input-label { color: var(--muted); font-size: 12px; min-width: 24px; }
    .accessory-set-remove {
      background: none;
      border: none;
      color: var(--muted2);
      cursor: pointer;
      font-size: 14px;
      padding: 2px 4px;
      margin-left: auto;
    }
    .accessory-set-remove:hover { color: var(--danger); }

    .add-set-btn {
      background: none;
      border: 1px dashed var(--border);
      border-radius: 6px;
      padding: 5px 12px;
      color: var(--muted);
      font-size: 12px;
      font-family: var(--font-d);
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: border-color 0.12s, color 0.12s;
      width: 100%;
      text-align: center;
    }
    .add-set-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* Suggestions strip */
    .suggestions-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }
    .suggestion-chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      transition: border-color 0.12s, color 0.12s;
      white-space: nowrap;
    }
    .suggestion-chip:hover { border-color: var(--accent); color: var(--accent); }
    .suggestion-chip.suggested { border-color: var(--info); color: var(--info); }

    /* Exercise picker modal */
    .picker-modal {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: var(--radius-lg);
      padding: 0;
      max-width: 440px;
      width: 100%;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .picker-header {
      padding: 20px 20px 0;
      flex-shrink: 0;
    }
    .picker-header h2 {
      font-size: 22px;
      margin-bottom: 12px;
    }
    .picker-search {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 9px 14px;
      color: var(--text);
      font-size: 14px;
      font-family: var(--font-b);
      outline: none;
      margin-bottom: 12px;
    }
    .picker-search:focus { border-color: var(--accent); }
    .picker-categories {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      padding-bottom: 12px;
    }
    .cat-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 3px 12px;
      font-size: 12px;
      font-family: var(--font-d);
      font-weight: 600;
      letter-spacing: 0.3px;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.12s;
    }
    .cat-btn.active { background: var(--accent); border-color: var(--accent); color: #000; }
    .picker-list {
      overflow-y: auto;
      flex: 1;
      padding: 0 20px;
    }
    .picker-category-label {
      font-family: var(--font-d);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted2);
      padding: 10px 0 6px;
      position: sticky;
      top: 0;
      background: var(--surface);
    }
    .picker-exercise {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: color 0.12s;
    }
    .picker-exercise:hover .picker-ex-name { color: var(--accent); }
    .picker-ex-name { font-size: 14px; font-weight: 500; }
    .picker-ex-type {
      font-size: 11px;
      font-family: var(--font-d);
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .picker-ex-type.type-assisted { color: var(--info); }
    .picker-ex-type.type-weighted { color: var(--accent-dim); }
    .picker-ex-type.type-standard { color: var(--muted2); }
    .picker-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      display: flex;
      gap: 10px;
    }

    /* ── Movement day lock + prompt ─────────────────── */
    .movement-lock-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 14px;
      color: var(--muted);
      transition: border-color 0.12s;
      flex-shrink: 0;
    }
    .movement-lock-btn:hover { border-color: var(--accent); }
    .movement-lock-btn.locked { border-color: var(--accent); background: var(--accent-bg); }

    .movement-prompt-section {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .movement-prompt-toggle {
      background: none;
      border: none;
      color: var(--muted2);
      font-size: 12px;
      cursor: pointer;
      padding: 0;
      font-family: var(--font-b);
    }
    .movement-prompt-toggle:hover { color: var(--muted); }
    .movement-prompt-body { margin-top: 10px; }
    .movement-prompt-text {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px;
      font-size: 11px;
      color: var(--muted);
      white-space: pre-wrap;
      word-break: break-word;
      font-family: monospace;
      line-height: 1.6;
      max-height: 200px;
      overflow-y: auto;
    }

    /* ── Movement day button ────────────────────────── */
    .movement-day-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 7px 12px;
      color: var(--muted);
      font-size: 12px;
      font-family: var(--font-b);
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: border-color 0.12s, color 0.12s;
      margin-top: 4px;
    }
    .movement-day-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Movement day modal ──────────────────────────── */
    .movement-modal {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: var(--radius-lg);
      padding: 0;
      max-width: 440px;
      width: 100%;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .movement-modal-header {
      padding: 24px 24px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .movement-modal-header h2 { font-size: 26px; margin-bottom: 4px; }
    .movement-tagline { color: var(--muted); font-size: 14px; font-style: italic; }
    .movement-modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px 24px;
    }
    .movement-exercise {
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }
    .movement-exercise:last-child { border-bottom: none; }
    .movement-ex-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .movement-ex-name {
      font-family: var(--font-d);
      font-size: 20px;
      font-weight: 700;
    }
    .movement-ex-cat {
      font-family: var(--font-d);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 4px;
    }
    .cat-Push { background: var(--accent-bg); color: var(--accent-dim); }
    .cat-MetCon { background: rgba(224,82,82,0.1); color: var(--danger); }

    .metcon-move-list {
      display: flex;
      flex-direction: column;
      gap: 0;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      margin-top: 4px;
    }
    .metcon-move-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .metcon-move-row:last-child { border-bottom: none; }
    .metcon-move-row:nth-child(odd) { background: var(--surface2); }
    .metcon-move-name { color: var(--text); font-weight: 500; }
    .metcon-move-reps {
      font-family: var(--font-d);
      font-weight: 700;
      color: var(--danger);
      font-size: 14px;
    }
    .cat-Pull { background: var(--info-bg); color: var(--info); }
    .cat-Hinge, .cat-Core { background: var(--success-bg); color: var(--success); }
    .movement-ex-prescription {
      font-family: var(--font-d);
      font-size: 16px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 4px;
    }
    .movement-ex-note { font-size: 13px; color: var(--muted); font-style: italic; }
    .movement-modal-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      display: flex;
      gap: 10px;
    }
    .movement-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      gap: 16px;
      color: var(--muted);
    }
    .movement-loading p { font-size: 14px; }

    /* ── Edit history ────────────────────────────────── */
    .edit-lift-block {
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }
    .edit-lift-block:last-child { border-bottom: none; }
    .edit-lift-name {
      font-family: var(--font-d);
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .edit-weight-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .edit-weight-row label {
      font-size: 12px;
      color: var(--muted);
      min-width: 50px;
    }
    .edit-sets-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .edit-set-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .edit-set-cell label {
      font-size: 10px;
      color: var(--muted2);
      font-family: var(--font-d);
      text-transform: uppercase;
    }

    /* ── Warmup sets ─────────────────────────────────── */
    .warmup-sets {
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px dashed var(--border);
    }
    .warmup-label, .work-sets-label {
      font-family: var(--font-d);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted2);
      margin-bottom: 8px;
    }
    .warmup-optional {
      font-weight: 400;
      letter-spacing: 0;
      text-transform: none;
      font-family: var(--font-b);
      font-size: 11px;
    }
    .work-sets-label { margin-bottom: 8px; }
    .warmup-rows { display: flex; flex-direction: column; gap: 4px; }
    .warmup-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      padding: 6px 8px;
      width: 100%;
      transition: background 0.12s, border-color 0.12s;
    }
    .warmup-row:hover { background: var(--surface2); border-color: var(--border); }
    .warmup-row.warmup-done { background: var(--success-bg); border-color: var(--success); }
    .warmup-check-btn {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
    }
    .warmup-check {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1.5px solid var(--border2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--success);
      transition: border-color 0.12s, background 0.12s;
    }
    .warmup-done .warmup-check {
      background: var(--success);
      border-color: var(--success);
      color: #000;
    }
    .warmup-weight {
      font-family: var(--font-d);
      font-size: 20px;
      font-weight: 700;
      color: var(--muted);
      min-width: 64px;
      cursor: pointer;
      border-bottom: 1px dashed var(--muted2);
    }
    .warmup-weight:hover { color: var(--accent); border-color: var(--accent); }
    .warmup-done .warmup-weight { color: var(--text); }
    .warmup-unit {
      font-size: 12px;
      font-weight: 400;
      color: var(--muted2);
      margin-left: 2px;
    }
    .warmup-reps {
      font-size: 13px;
      color: var(--muted2);
      cursor: pointer;
      border-bottom: 1px dashed transparent;
    }
    .warmup-reps:hover { color: var(--accent); border-bottom-color: var(--accent); }
    .warmup-done .warmup-reps { color: var(--muted); }
    .sets-count {
      font-size: 12px;
      color: var(--muted);
      margin-left: 4px;
    }

    /* ── Finish button ────────────────────────────────── */
    .finish-btn {
      width: 100%;
      padding: 17px;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: var(--radius);
      font-family: var(--font-d);
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 1px;
      cursor: pointer;
      transition: opacity 0.12s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .settings-section-title {
      font-family: var(--font-d);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted2);
      margin-bottom: 4px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .settings-row {

      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .settings-row:last-child { border-bottom: none; }
    .settings-label {
      font-size: 14px;
      font-weight: 500;
    }

    /* ── Section title ────────────────────────────────── */
    .section-title {
      font-family: var(--font-d);
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }

    }

      margin: 0 auto;
    }

    .loading-msg {
      text-align: center;
      padding: 32px;
      color: var(--muted);
      font-size: 14px;
    }

    /* ── Timer ───────────────────────────────────────── */
    .timer-bar {

    #timer-rest-label { display: none; }

<script>
// Stub all onclick functions so they queue if the module hasn't loaded yet
(function() {
  const fns = [
    'showTab','startTimer','openFinishModal','closeFinishModal','confirmFinish',
    'timingModalConfirm','timingModalCancel','openMovementDay','closeMovementDay',
    'openRampBack','closeRampBack','applyRampBack','editRampBackWeight','editRampBackSets','toggleRampBackPrompt',
    'doMovementDay','renderMovementWorkout','toggleMovementSet',
    'openExercisePicker','closeExercisePicker','openAddCustomExercise',
    'closeCustomExercise','saveCustomExercise','setPickerCategory','filterPicker',
    'cycleSet','toggleWarmup','editWarmupWeight','editLiftWeight','addSuggestedAccessory',
    'cycleMovementSet','toggleMovementLock','rerollMovementDay','toggleMovementPrompt','editMovementWeight','toggleMetcon','toggleMetconDone',
    'openEditHistory','closeEditHistory','saveEditHistory','updateEditSet','updateEditWeight',
    'buildBandColorRows','editBandColor','addBandColor','removeBandColor','updateAccessorySetField','editMovementModifier',
    'addAccessoryFromPicker','removeAccessory','addAccessorySet',
    'removeAccessorySet','updateAccessorySet','editLift','editName',
    'toggleDay','quickToggleDay','editMinIncrement','handleSignOut'
  ];
  const queue = {};
  fns.forEach(fn => {
    queue[fn] = [];
    window[fn] = function(...args) {
      // If the real function has been assigned, call it
      if (window['_real_' + fn]) return window['_real_' + fn](...args);
      queue[fn].push(args);
    };
  });
  // After module loads, real functions replace stubs via window.X = ...
  // We intercept that assignment to flush the queue
  fns.forEach(fn => {
    Object.defineProperty(window, fn, {
      set(realFn) {
        window['_real_' + fn] = realFn;
        // Flush any queued calls
        (queue[fn] || []).forEach(args => realFn(...args));
        queue[fn] = [];
      },
      get() { return window['_real_' + fn] || function() {}; },
      configurable: true,
    });
  });
})();
</script>
